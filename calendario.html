<script>
(function () {
  'use strict';

  /* ─── TODAY ─── */
  const today = new Date();

  /* ─── SEMESTER BOUNDS ─── */
  const FIRST    = new Date(2026, 1, 3);   // 3 feb 2026
  const LAST     = new Date(2026, 4, 29);  // 29 may 2026
  const LAST_END = new Date(2026, 4, 30);  // medianoche del 30 = fin real del día 29
  const FINALS   = new Date(2026, 5, 14);  // 14 jun 2026 — fin de dos semanas de finales
  const NEXT_SEM = new Date(2026, 7, 10);  // 10 ago 2026 — inicio siguiente semestre
  const _dow = LAST.getDay();
  const FINALS_START = new Date(LAST.getTime() + (_dow === 1 ? 7 : (8 - _dow) % 7) * 86400000);

  /* ─── EVENT TYPES ─── */
  const EV = {
    ciclo:      { label: 'Ciclo escolar',          rgb: '155,191,181', alpha: 0.13, pri: 1, dot: '#7aa89e' },
    intersem:   { label: 'Periodo intersemestral', rgb: '80,155,185',  alpha: 0.18, pri: 1, dot: '#50a0bc' },
    ventanilla: { label: 'Atención Ventanilla 9',  rgb: '100,130,160', alpha: 0.13, pri: 2, dot: '#6482a0' },
    vac:        { label: 'Periodo vacacional',     rgb: '60,100,210',  alpha: 0.24, pri: 2, dot: '#3c64d2' },
    inslin:     { label: 'Inscripción en línea',   rgb: '130,100,180', alpha: 0.20, pri: 3, dot: '#8264b4' },
    idiomas:    { label: 'Inscr. idiomas',         rgb: '130,100,180', alpha: 0.20, pri: 3, dot: '#8264b4' },
    casilleros: { label: 'Solicit. casilleros',    rgb: '100,160,120', alpha: 0.20, pri: 3, dot: '#64a078' },
    insextr:    { label: 'Inscr. Ex. Extr.',       rgb: '140,110,200', alpha: 0.22, pri: 4, dot: '#8c6ec8' },
    exextr:     { label: 'Ex. Extraordinarios',    rgb: '200,150,80',  alpha: 0.26, pri: 5, dot: '#c89650' },
    exord:      { label: 'Ex. Ordinarios',         rgb: '200,85,85',   alpha: 0.26, pri: 6, dot: '#c85555' },
  };

  /* ─── EVENT RANGES ─── */
  const RANGES = [
    { ev: 'ciclo',      s: [2026,1,3],  e: [2026,4,29] },
    { ev: 'ventanilla', s: [2026,1,13], e: [2026,3,29] },
    { ev: 'inslin',     s: [2026,0,26], e: [2026,1,7]  },
    { ev: 'idiomas',    s: [2026,0,26], e: [2026,0,28] },
    { ev: 'casilleros', s: [2026,2,5],  e: [2026,2,11] },
    { ev: 'insextr',    s: [2026,2,2],  e: [2026,2,6]  },
    { ev: 'exextr',     s: [2026,3,13], e: [2026,3,24] },
    { ev: 'exord',      s: [2026,5,1],  e: [2026,5,13] },
    { ev: 'intersem',   s: [2026,5,15], e: [2026,7,7]  },
    { ev: 'vac',        s: [2026,6,6],  e: [2026,6,24] },
  ].map(function (r) {
    return { ev: r.ev, start: new Date(r.s[0],r.s[1],r.s[2]), end: new Date(r.e[0],r.e[1],r.e[2]) };
  });

  /* ─── HOLIDAYS ─── */
  const HOLIDAYS = [
    [2026,0,1],[2026,1,2],[2026,2,16],
    [2026,2,30],[2026,2,31],                         // Semana Santa
    [2026,3,1],[2026,3,2],[2026,3,3],[2026,3,4],[2026,3,5], // Semana Santa cont.
    [2026,4,1],[2026,4,10],[2026,4,15],
  ].map(function (h) { return new Date(h[0],h[1],h[2]); });

  /* ─── HELPERS ─── */
  const MLONG = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const MSHRT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const DOW   = ['L','M','M','J','V','S','D'];

  function sd(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function isHol(d)  { return HOLIDAYS.some(function (h) { return sd(h, d); }); }

  /* ─── NO-CLASS PERIODS (within semester, no teal fill) ─── */
  var NO_CLASS = [
    { s: new Date(2026,2,30), e: new Date(2026,3,5) }, // Semana Santa
  ];
  function isNoClass(d) { return NO_CLASS.some(function(r){ return d >= r.s && d <= r.e; }); }
  function getEvs(d) {
    return RANGES
      .filter(function (r) { return d >= r.start && d <= r.end; })
      .map(function (r) { return Object.assign({}, EV[r.ev], { key: r.ev }); })
      .sort(function (a, b) { return b.pri - a.pri; });
  }
  function fmt(d) { return d.getDate() + ' ' + MSHRT[d.getMonth()]; }

  /* ─── PROGRESS STRIP ─── */
  function renderProgress() {
    var total_ms   = LAST_END - FIRST;
    var elapsed_ms = Math.max(0, Math.min(total_ms, today - FIRST));
    var pct        = Math.min(100, Math.floor(elapsed_ms / total_ms * 100));
    var remain     = Math.max(0, Math.floor((LAST_END - today) / 86400000));
    var daysVac    = Math.max(0, Math.ceil( (NEXT_SEM  - today) / 86400000));

    var afterSem    = today >= LAST_END;
    var inFinals    = today >= FINALS_START && today <= FINALS;
    var afterFinals = today > FINALS;
    var inVacation  = afterFinals && today < NEXT_SEM;

    var displayPct = afterSem ? 100 : pct;
    var barClass   = inFinals  ? ' cal-progress-bar--finals'
                   : afterSem  ? ' cal-progress-bar--neutral'
                   :             '';
    var info       = inFinals   ? '—'
                   : inVacation ? daysVac + 'd'
                   : afterSem   ? ''
                   : remain === 0 ? pct + '% · ' + Math.ceil((LAST_END - today) / 3600000) + 'h'
                   :               pct + '% &middot; ' + remain + ' días';

    return '<div class="cal-progress">' +
      '<div class="cal-progress-top">' +
        '<span class="cal-progress-title">Semestre 2026-2</span>' +
        '<span class="cal-progress-info">' + info + '</span>' +
      '</div>' +
      '<div class="cal-progress-bar-wrap">' +
        '<div class="cal-progress-bar' + barClass + '" style="width:' + displayPct + '%"></div>' +
      '</div>' +
      '<div class="cal-progress-meta">' +
        '<span class="cal-progress-date">3 feb 2026</span>' +
        '<span class="cal-progress-today">&#9679; ' + fmt(today) + ' ' + today.getFullYear() + '</span>' +
        '<span class="cal-progress-date">29 may 2026</span>' +
      '</div>' +
    '</div>';
  }

  /* ─── MONTH GRID ─── */
  function renderMonth(year, month) {
    var first  = new Date(year, month, 1);
    var last   = new Date(year, month + 1, 0);
    var offset = (first.getDay() + 6) % 7;

    var dowRow = DOW.map(function (d, i) {
      return '<div class="cal-dow' + (i >= 5 ? ' wknd' : '') + '">' + d + '</div>';
    }).join('');

    // Trámite events that get the thin highlight strip (only inscripción en línea for now)
    var TRM = { inslin: 1 };

    // Pre-compute per-day data
    var days = [];
    for (var day = 1; day <= last.getDate(); day++) {
      var date = new Date(year, month, day);
      var dow  = (date.getDay() + 6) % 7;
      var traced = date >= FIRST && date <= today;
      var inSem  = date >= FIRST && date <= LAST;
      var evs    = getEvs(date).filter(function(e) { return e.key !== 'ciclo'; });
      var topEv  = evs.length ? evs[0] : null;
      days.push({
        day:     day,
        dow:     dow,
        wknd:    dow >= 5,
        isT:     sd(date, today),
        hol:     isHol(date),
        inSem:   inSem,
        fillKey: isNoClass(date) ? '' : traced ? 'traced' : inSem ? 'insem' : (evs.length && evs.filter(function(e){return e.key==='exord';})[0] && dow < 6) ? 'exord' : '',
        evKey:   topEv ? topEv.key : '',
        evRgb:   topEv ? topEv.rgb : '',
        trmKey:  (topEv && TRM[topEv.key]) ? topEv.key : '',
        trmRgb:  (topEv && TRM[topEv.key]) ? topEv.rgb : '',
        semStart: sd(date, FIRST),
        semEnd:   sd(date, LAST),
      });
    }

    var cells = '';
    for (var i = 0; i < offset; i++) cells += '<div class="cal-cell empty"></div>';

    for (var i = 0; i < days.length; i++) {
      var d   = days[i];
      var col = d.dow;
      var prev = i > 0               ? days[i - 1] : null;
      var next = i < days.length - 1 ? days[i + 1] : null;
      var abv  = i >= 7              ? days[i - 7] : null;
      var blw  = i + 7 < days.length ? days[i + 7] : null;

      // Fill-group neighbours (no cross at row edges horizontally)
      var fL = !!(prev && prev.fillKey === d.fillKey && d.fillKey && col !== 0);
      var fR = !!(next && next.fillKey === d.fillKey && d.fillKey && col !== 6);
      var fT = !!(abv  && abv.fillKey  === d.fillKey && d.fillKey);
      var fB = !!(blw  && blw.fillKey  === d.fillKey && d.fillKey);

      // Event-group neighbours
      var eL = !!(prev && prev.evKey === d.evKey && d.evKey && col !== 0);
      var eR = !!(next && next.evKey === d.evKey && d.evKey && col !== 6);
      var eT = !!(abv  && abv.evKey  === d.evKey && d.evKey);
      var eB = !!(blw  && blw.evKey  === d.evKey && d.evKey);

      // Trámite highlight neighbours (horizontal only, no vertical strip)
      var tL = !!(prev && prev.trmKey === d.trmKey && d.trmKey && col !== 0);
      var tR = !!(next && next.trmKey === d.trmKey && d.trmKey && col !== 6);

      // Exord: only horizontal connectivity (each week row is its own block)
      if (d.fillKey === 'exord') { fT = false; fB = false; }

      // Background
      var bg = d.fillKey === 'traced' ? 'rgba(155,191,181,0.30)'
             : d.fillKey === 'insem'  ? 'rgba(155,191,181,0.07)'
             : d.fillKey === 'exord'  ? 'rgba(160,60,90,0.18)'
             : '';

      // Border-radius: round only outer corners of the fill-group block
      var tl = (!fL && !fT) ? '4px' : '0';
      var tr = (!fR && !fT) ? '4px' : '0';
      var br = (!fR && !fB) ? '4px' : '0';
      var bl = (!fL && !fB) ? '4px' : '0';

      var st = [];
      if (bg) st.push('background:' + bg);
      if (fL || fR || fT || fB) st.push('border-radius:' + tl + ' ' + tr + ' ' + br + ' ' + bl);

      // Vacaciones: dotted border + connectivity border-radius (eliminates corner zurcos)
      if (d.evKey === 'vac') {
        var b = '1px dashed rgba(100,140,220,0.40)';
        if (!eT) st.push('border-top:'    + b);
        if (!eB) st.push('border-bottom:' + b);
        if (!eL) st.push('border-left:'   + b);
        if (!eR) st.push('border-right:'  + b);
        st.push('border-radius:'
          + (!eL&&!eT?'4px':'0') + ' '
          + (!eR&&!eT?'4px':'0') + ' '
          + (!eR&&!eB?'4px':'0') + ' '
          + (!eL&&!eB?'4px':'0'));
      }
      var styleAttr = st.length ? ' style="' + st.join(';') + '"' : '';

      var cls = 'cal-cell'
        + (d.wknd              ? ' wknd'       : '')
        + (d.isT               ? ' today-cell' : '')
        + (d.hol               ? ' hol'        : '')
        + (!d.inSem            ? ' out-sem'    : '')
        + (d.fillKey==='exord' ? ' exord-cell' : '')
        + (d.trmKey            ? ' trm-cell'   : '');

      var trmHl = '';
      if (d.trmKey) {
        var hlRad = (tL?'0':'8px')+' '+(tR?'0':'8px')+' '+(tR?'0':'8px')+' '+(tL?'0':'8px');
        trmHl = '<div style="position:absolute;left:0;right:0;height:14px;top:50%;transform:translateY(-50%);background:rgba(72,80,210,0.28);border-radius:'+hlRad+';z-index:1;pointer-events:none"></div>';
      }
      cells += '<div class="' + cls + '"' + styleAttr + '>'
        + trmHl
        + '<span class="day-num">' + d.day + '</span>'
        + '</div>';
    }

    return '<div class="cal-month-card" data-month="' + month + '">'
      + '<div class="cal-month-name">' + MLONG[month] + ' ' + year + '</div>'
      + '<div class="cal-dow-row">' + dowRow + '</div>'
      + '<div class="cal-grid">' + cells + '</div>'
      + '</div>';
  }
  /* ─── LEGEND ─── */
  function renderLegend() {
    var items = [
      { color: '#7aa89e',                    label: 'Días del semestre'      },
      { color: '#3c64d2', dashed: true,      label: 'Vacaciones admin.'      },
      { color: '#4850d2',                    label: 'Trámites inscripción'   },
      { color: '#c89650',                    label: 'Días inhábiles'         },
      { color: '#c85555',                    label: 'Exámenes finales'       },
    ];
    return '<div class="cal-legend-grid">'
      + items.map(function (item) {
          var sw = item.dashed
            ? 'border:1.5px dashed ' + item.color + ';background:rgba(100,140,220,0.07);'
            : 'background:' + item.color + ';';
          return '<div class="cal-legend-item">'
            + '<div class="cal-legend-swatch" style="' + sw + '"></div>'
            + '<span class="cal-legend-label">' + item.label + '</span>'
            + '</div>';
        }).join('')
      + '</div>';
  }

  /* ─── RENDER ─── */
  var MONTHS = [[2026,0],[2026,1],[2026,2],[2026,3],[2026,4],[2026,5],[2026,6],[2026,7]];
  var main = document.getElementById('cal-main');
  main.innerHTML = renderProgress()
    + '<div id="cdc-root"></div>'
    + '<div id="cdv-root"></div>'
    + '<div class="cal-section-divider"><span class="cal-divider-line"></span><span class="cal-divider-label">Calendario 2026-2</span><span class="cal-divider-line"></span></div>'
    + renderLegend()
    + '<div class="cal-months-grid">'
    + MONTHS.map(function (ym) { return renderMonth(ym[0], ym[1]); }).join('')
    + '</div>';

  /* ─── DAY SCHEDULE ─── */
  (function () {
    'use strict';

    /* ── palette (mirrors avance.js PAL) ── */
    var PAL = [
      {bg:'#0c3228',ac:'#3fc99a'},{bg:'#18153d',ac:'#7b6ed8'},
      {bg:'#2b1238',ac:'#c46fd6'},{bg:'#0c2d14',ac:'#3fc46f'},
      {bg:'#321414',ac:'#d65050'},{bg:'#2b1e0c',ac:'#d6944e'},
      {bg:'#2b0c1e',ac:'#d64e8a'},{bg:'#0c1e32',ac:'#4e94d6'},
      {bg:'#1e2b0c',ac:'#8ad64e'},{bg:'#32200c',ac:'#d6b44e'},
      {bg:'#0c2b2b',ac:'#4ed6d6'},{bg:'#2b0c0c',ac:'#d66b4e'},
    ];

    /* ── day-of-week short labels shown in pills ── */
    var PILL_LABELS = ['Do','Lu','Ma','Mi','Ju','Vi','Sá'];

    /* ── day-of-week full labels stored in subject.dias ── */
    var DOW_FULL = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

    /* ── HTML escape ── */
    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    /* ── zero-pad to YYYY-MM-DD ── */
    function isoDate(d) {
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2,'0');
      var day = String(d.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + day;
    }

    /* ── load data from localStorage ── */
    function loadData() {
      try {
        var raw = localStorage.getItem('ukishima_avance_v2');
        if (!raw) return { subjects: [], progress: {} };
        var parsed = JSON.parse(raw);
        return {
          subjects: Array.isArray(parsed.subjects) ? parsed.subjects : [],
          progress: (parsed.progress && typeof parsed.progress === 'object') ? parsed.progress : {}
        };
      } catch (e) {
        return { subjects: [], progress: {} };
      }
    }

    /* ── state ── */
    var todayZero = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var selDate   = new Date(todayZero);  // selected date (zeroed)
    var tlExpanded = false;               // timeline expand state
    var timerRef  = null;

    /* ── produce a date offset by N days from a zeroed date ── */
    function addDays(d, n) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    }

    /* ── render the carousel ── */
    function renderCarousel() {
      var diffDays = Math.round((todayZero - selDate) / 86400000);
      /* pill extrema que se sustituye por "hoy" si está fuera del rango */
      var replacePill = diffDays > 3 ? 3 : (diffDays < -3 ? -3 : null);
      var html = '<div class="cdc-wrap">';
      for (var offset = -3; offset <= 3; offset++) {
        if (offset === replacePill) {
          /* pill de "ir a hoy" reemplaza la extrema */
          var arrow = diffDays > 3 ? '→' : '←';
          html += '<button class="cdc-pill cdc-today-pill" data-goto-today="1" aria-label="Ir a hoy">'
            + '<span class="cdc-dow">hoy</span>'
            + '<span class="cdc-num">' + arrow + '</span>'
            + '<span class="cdc-mon">&nbsp;</span>'
            + '</button>';
        } else {
          var d       = addDays(selDate, offset);
          var isSel   = offset === 0;
          var isToday = d.getTime() === todayZero.getTime();
          var label   = PILL_LABELS[d.getDay()];
          var num     = d.getDate();
          var month   = MSHRT[d.getMonth()];
          var cls = 'cdc-pill' + (isSel ? ' cdc-pill--sel' : '') + (isToday ? ' cdc-today' : '');
          html += '<button class="' + cls + '" data-offset="' + offset + '" aria-label="' + label + ' ' + num + '">'
            + '<span class="cdc-dow">' + label + '</span>'
            + '<span class="cdc-num">' + num + '</span>'
            + '<span class="cdc-mon">' + month + '</span>'
            + '</button>';
        }
      }
      html += '</div>';
      return html;
    }

    /* ── render the day view ── */
    function renderDayView() {
      var data     = loadData();
      var subjects = data.subjects;
      var progress = data.progress;
      var isToday  = selDate.getTime() === todayZero.getTime();
      var dowFull  = DOW_FULL[selDate.getDay()];
      var selIso   = isoDate(selDate);

      var HOUR_H  = 48;   // px per hour
      var now     = new Date();
      var nowH    = now.getHours() + now.getMinutes() / 60;
      var START_H = 7;
      var END_H   = 22;

      /* subjects with class this day */
      var todaySubs = subjects.filter(function(sub) {
        return Array.isArray(sub.dias) && sub.dias.indexOf(dowFull) !== -1;
      });

      /* parse "HH:MM" → decimal hours, null if absent/invalid */
      function parseH(s) {
        if (!s) return null;
        var p = s.split(':'), h = parseInt(p[0], 10), m = parseInt(p[1] || '0', 10);
        return isNaN(h) ? null : h + m / 60;
      }


      var totalPx = (END_H - START_H) * HOUR_H;

      /* current time */
      var nowPx = (nowH - START_H) * HOUR_H;
      var nowLbl = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      var showNow = isToday && nowH >= START_H && nowH <= END_H;

      /* hour grid rows */
      var rows = '';
      for (var h = START_H; h <= END_H; h++) {
        rows += '<div class="cdv-tl-row" style="top:' + ((h - START_H) * HOUR_H) + 'px">'
          + '<span class="cdv-tl-time">' + String(h).padStart(2,'0') + ':00</span>'
          + '<div class="cdv-tl-line"></div>'
          + '</div>';
      }

      /* current time indicator */
      var nowLine = showNow
        ? '<div class="cdv-tl-now" style="top:' + nowPx.toFixed(1) + 'px">'
          + '<span class="cdv-tl-now-lbl">' + nowLbl + '</span>'
          + '</div>'
        : '';

      function subColor(colorIdx, alpha) {
        var h = ((colorIdx || 0) * 30) % 360;
        return alpha !== undefined
          ? 'hsla(' + h + ',75%,10%,' + alpha + ')'
          : 'hsl(' + h + ',75%,65%)';
      }

      /* event blocks (subjects with a time) */
      var events = '';
      var noTimeSubs = [];
      todaySubs.forEach(function(sub) {
        var h = parseH(sub.hora);
        if (h === null) { noTimeSubs.push(sub); return; }

        var ac      = subColor(sub.colorIdx);
        var bg      = subColor(sub.colorIdx, 0.7);
        var prog    = progress[sub.id] || {};
        var tasks   = Array.isArray(prog.tareas)   ? prog.tareas   : [];
        var exams   = Array.isArray(prog.examenes) ? prog.examenes : [];
        var dueToday  = tasks.filter(function(t) { return !t.done && t.dueDate === selIso; }).length;
        var pendExams = exams.filter(function(e) { return e.grade === '' || e.grade === null || e.grade === undefined; }).length;

        var chips = '';
        if (dueToday)  chips += '<span class="cdv-chip cdv-chip--task">' + dueToday + ' entrega' + (dueToday > 1 ? 's' : '') + '</span>';
        if (pendExams) chips += '<span class="cdv-chip cdv-chip--exam">' + pendExams + ' ex.</span>';

        var topPx = (h - START_H) * HOUR_H;
        var hgtPx = 1.5 * HOUR_H;

        var icon = sub.icon || 'assets/images/d0.jpg';
        events += '<div class="cdv-tl-event" style="top:' + topPx.toFixed(1) + 'px;height:' + hgtPx.toFixed(1) + 'px;border-left-color:' + ac + ';background:' + bg + ';" onclick="location.href=\'avance.html#mat/' + esc(sub.id) + '\'">'
          + '<img class="cdv-ev-icon" src="' + esc(icon) + '" onerror="this.src=\'assets/images/d0.jpg\'" alt="">'
          + '<div class="cdv-ev-body">'
          + '<div class="cdv-ev-name">' + esc(sub.name || '') + '</div>'
          + (sub.hora ? '<div class="cdv-ev-meta">' + esc(sub.hora) + '</div>' : '')
          + (chips ? '<div class="cdv-card-chips" style="margin-top:3px">' + chips + '</div>' : '')
          + '</div>'
          + '</div>';
      });

      /* subjects without time — floating cards above timeline */
      var floats = noTimeSubs.map(function(sub) {
        var ac  = subColor(sub.colorIdx);
        var bg  = subColor(sub.colorIdx, 0.7);
        var prog    = progress[sub.id] || {};
        var tasks   = Array.isArray(prog.tareas)   ? prog.tareas   : [];
        var exams   = Array.isArray(prog.examenes) ? prog.examenes : [];
        var dueToday  = tasks.filter(function(t) { return !t.done && t.dueDate === selIso; }).length;
        var pendExams = exams.filter(function(e) { return e.grade === '' || e.grade === null || e.grade === undefined; }).length;
        var chips = '';
        if (dueToday)  chips += '<span class="cdv-chip cdv-chip--task">' + dueToday + ' entrega' + (dueToday > 1 ? 's' : '') + '</span>';
        if (pendExams) chips += '<span class="cdv-chip cdv-chip--exam">' + pendExams + ' ex.</span>';
        var icon = sub.icon || 'assets/images/d0.jpg';
        return '<div class="cdv-card" style="border-left-color:' + ac + ';background:' + bg + ';cursor:pointer" onclick="location.href=\'avance.html#mat/' + esc(sub.id) + '\'">'
          + '<img class="cdv-ev-icon" src="' + esc(icon) + '" onerror="this.src=\'assets/images/d0.jpg\'" alt="">'
          + '<div class="cdv-card-body">'
          + '<div class="cdv-card-name">' + esc(sub.name || '') + '</div>'
          + (chips ? '<div class="cdv-card-chips">' + chips + '</div>' : '')
          + '</div></div>';
      }).join('');

      /* due tasks section */
      var dueTasks = [];
      subjects.forEach(function(sub) {
        var prog  = progress[sub.id] || {};
        (Array.isArray(prog.tareas) ? prog.tareas : []).forEach(function(t) {
          if (t.dueDate === selIso && !t.done)
            dueTasks.push({ text: t.text, subName: sub.name || '', colorIdx: sub.colorIdx || 0 });
        });
      });
      var dueSection = dueTasks.length
        ? '<div class="cdv-due-section"><div class="cdv-due-title">Entregas</div>'
          + dueTasks.map(function(t) {
              var color = 'hsl(' + (((t.colorIdx || 0) * 30) % 360) + ',75%,65%)';
              return '<div class="cdv-due-item">'
                + '<span class="cdv-due-dot" style="background:' + color + '"></span>'
                + '<span class="cdv-due-text">' + esc(t.text || '') + '</span>'
                + '<span class="cdv-due-sub">'  + esc(t.subName)    + '</span>'
                + '</div>';
            }).join('') + '</div>'
        : '';

      var tlClass = 'cdv-timeline' + (tlExpanded ? ' cdv-timeline--exp' : '');
      return '<div class="cdv-wrap">'
        + (floats ? '<div class="cdv-floats">' + floats + '</div>' : '')
        + '<div class="' + tlClass + '" data-nowpx="' + nowPx.toFixed(1) + '">'
        + '<div class="cdv-tl-inner" style="height:' + totalPx + 'px">'
        + rows + nowLine + events
        + '</div></div>'
        + dueSection
        + '</div>';
    }

    /* ── full repaint ── */
    function repaint() {
      document.getElementById('cdc-root').innerHTML = renderCarousel();
      document.getElementById('cdv-root').innerHTML = renderDayView();
      bindCarousel();
      bindTimeline();
      /* in collapsed mode, scroll so now-line sits near the top */
      if (!tlExpanded) {
        requestAnimationFrame(function() {
          var tlEl  = document.querySelector('.cdv-timeline');
          var nowLn = document.querySelector('.cdv-tl-now');
          if (tlEl && nowLn) {
            tlEl.scrollTop = Math.max(0, parseFloat(nowLn.style.top) - 12);
          }
        });
      }
    }

    /* ── bind timeline click (expand / collapse) ── */
    function bindTimeline() {
      var tlEl = document.querySelector('.cdv-timeline');
      if (!tlEl) return;
      tlEl.addEventListener('click', function() {
        /* visual position of now-line before toggle */
        var prevNowPx    = parseFloat(tlEl.dataset.nowpx || '0');
        var prevScrollTop = tlEl.scrollTop;
        var visualNowY   = prevNowPx - prevScrollTop;   // px from top of box

        tlExpanded = !tlExpanded;
        repaint();

        /* after re-render, restore visual position of now-line */
        requestAnimationFrame(function() {
          var newTl  = document.querySelector('.cdv-timeline');
          var nowLn  = document.querySelector('.cdv-tl-now');
          if (!newTl) return;
          var newNowPx = nowLn ? parseFloat(nowLn.style.top) : 0;
          newTl.scrollTop = Math.max(0, newNowPx - visualNowY);
        });
      });
    }

    /* ── bind pill clicks + swipe + return-to-today ── */
    function bindCarousel() {
      var root = document.getElementById('cdc-root');
      if (!root) return;

      /* pill clicks */
      root.querySelectorAll('.cdc-pill').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (btn.getAttribute('data-goto-today')) {
            selDate = new Date(todayZero);
          } else {
            selDate = addDays(selDate, parseInt(btn.getAttribute('data-offset'), 10));
          }
          repaint();
        });
      });

    }

    /* ── auto-refresh hour bar every minute when viewing today ── */
    function scheduleRefresh() {
      if (timerRef) clearInterval(timerRef);
      timerRef = setInterval(function () {
        var isViewingToday = selDate.getTime() === todayZero.getTime();
        if (isViewingToday) {
          document.getElementById('cdv-root').innerHTML = renderDayView();
        }
      }, 60000);
    }

    /* ── init ── */
    repaint();
    scheduleRefresh();

  })();

})();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('[SW] Registro fallido:',e);});</script>
