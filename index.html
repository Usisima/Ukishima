<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemáticas · UNAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="home-container">
        <div class="home-logo">
            <div class="logo-symbol">Ж</div>
            <div class="logo-text">
                <h1>Matemáticas</h1>
                <p>Facultad de Ciencias · UNAM</p>
            </div>
        </div>

        <nav class="home-menu">
            <!-- NOTA: Rutas directas, sin /pages/ -->
            <a href="temarios.html" class="menu-card">
                <div class="menu-icon">📚</div>
                <div class="menu-info">
                    <h2>Temarios</h2>
                    <p>Plan de estudios · Progreso · Optativas</p>
                </div>
                <div class="menu-arrow">→</div>
            </a>

            <a href="libros.html" class="menu-card">
                <div class="menu-icon">📖</div>
                <div class="menu-info">
                    <h2>Bibliografía</h2>
                    <p>Libros · Referencias · Complementaria</p>
                </div>
                <div class="menu-arrow">→</div>
            </a>
        </nav>

        <footer class="home-footer">
            <span>Progreso global: <strong id="global-progress">0%</strong></span>
        </footer>
    </div>

    <script>
        const TOTAL_CREDITOS = 352;
        const SK_TEMA = 'mat_tema_v1';
        
        function loadDB(k) {
            try { return JSON.parse(localStorage.getItem(k) || '{}'); }
            catch { return {}; }
        }
        
        function getGlobalProgress() {
            const temaDB = loadDB(SK_TEMA);
            const totalTemas = Object.keys(temaDB).length;
            const temasCompletados = Object.values(temaDB).filter(v => v === true).length;
            if (totalTemas === 0) return 0;
            return Math.round((temasCompletados / totalTemas) * 100);
        }
        
        document.getElementById('global-progress').textContent = getGlobalProgress() + '%';
    </script>
</body>
</html>
