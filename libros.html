<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NotePlayer · Libros</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/libros.css">
</head>
<body>

<!-- ── TOP BAR ─────────────────────────────── -->
<header class="top-bar">
  <div class="tb-left">
    <a href="index.html" class="logo-text">NotePlayer</a>
    <div class="tb-divider"></div>
    <div>
      <div class="tb-inst-title">Biblioteca</div>
      <div class="tb-inst-sub">Libros</div>
    </div>
  </div>
  <div class="tb-right">
    <button class="icon-btn" id="btn-search-toggle" aria-label="Buscar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="icon-btn" id="btn-filter" aria-label="Filtrar">
      <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
    </button>
  </div>
</header>

<!-- ── SEARCH BAR (collapsible) ────────────── -->
<div class="search-wrap" id="search-bar-wrap" style="display:none">
  <div class="search-bar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="lib-search-input" placeholder="Buscar por título, autor, tema…" autocomplete="off">
    <span class="search-clear" id="lib-search-clear">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </span>
  </div>
</div>

<!-- ── FILTER CHIPS ─────────────────────────── -->
<div class="filter-chips-wrap" id="filter-chips-wrap" style="display:none">
  <div class="filter-chips" id="filter-chips">
    <button class="chip active" data-cat="all">Todos</button>
    <button class="chip" data-cat="calculo">Cálculo</button>
    <button class="chip" data-cat="algebra">Álgebra</button>
    <button class="chip" data-cat="estadistica">Estadística</button>
    <button class="chip" data-cat="geometria">Geometría</button>
    <button class="chip" data-cat="analisis">Análisis</button>
  </div>
</div>

<!-- ── MAIN SCROLL AREA ──────────────────────── -->
<main class="lib-main" id="lib-main">

  <!-- HERO / STATS ──────────────────────────── -->
  <div class="lib-hero">
    <div class="lib-hero-stat">
      <span class="hero-num" id="stat-total">—</span>
      <span class="hero-label">Libros</span>
    </div>
    <div class="hero-divider"></div>
    <div class="lib-hero-stat">
      <span class="hero-num" id="stat-favs">—</span>
      <span class="hero-label">Favoritos</span>
    </div>
    <div class="hero-divider"></div>
    <div class="lib-hero-stat">
      <span class="hero-num" id="stat-cats">—</span>
      <span class="hero-label">Categorías</span>
    </div>
  </div>

  <!-- RECENTLY ADDED ─────────────────────────── -->
  <section class="section" id="sec-recent">
    <div class="section-header">
      <h2 class="section-title">Agregados recientemente</h2>
    </div>
    <div class="hscroll" id="recent-scroll">
      <!-- populated by JS -->
    </div>
  </section>

  <!-- DIVIDER ──────────────────────────────── -->
  <div class="lib-section-divider">
    <span>Todos los libros</span>
  </div>

  <!-- SORT ROW ─────────────────────────────── -->
  <div class="sort-row">
    <span class="sort-label">Ordenar:</span>
    <div class="sort-options" id="sort-options">
      <button class="sort-btn active" data-sort="title">Título</button>
      <button class="sort-btn" data-sort="author">Autor</button>
      <button class="sort-btn" data-sort="cat">Categoría</button>
    </div>
    <button class="view-toggle" id="view-toggle" title="Cambiar vista">
      <svg id="vt-grid" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <svg id="vt-list" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" style="display:none"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <!-- GRID VIEW ────────────────────────────── -->
  <div class="lib-grid-section" id="grid-section">
    <div class="lib-grid" id="lib-grid">
      <!-- populated by JS -->
    </div>
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">📚</div>
      <p>No se encontraron libros</p>
      <span>Prueba con otro término o categoría</span>
    </div>
  </div>

  <!-- LIST VIEW ────────────────────────────── -->
  <div class="lib-list-section hidden" id="list-section">
    <div class="lib-list" id="lib-list">
      <!-- populated by JS -->
    </div>
  </div>

</main>

<!-- ── BOTTOM NAV ───────────────────────────── -->
<nav class="bottom-nav">
  <div class="nav-item" onclick="location.href='index.html'">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="nav-label">Inicio</span>
  </div>
  <div class="nav-item active">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span class="nav-label">Libros</span>
  </div>
  <div class="nav-item" onclick="location.href='temarios.html'">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <span class="nav-label">Temarios</span>
  </div>
  <div class="nav-item" onclick="location.href='index.html#favs'">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span class="nav-label">Favoritos</span>
  </div>
</nav>

<!-- ── BOOK DETAIL MODAL ─────────────────────── -->
<div class="book-modal hidden" id="book-modal" role="dialog" aria-modal="true">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-body" id="modal-body">
      <!-- populated by JS -->
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/libros.js"></script>
</body>
</html>
