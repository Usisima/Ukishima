<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bibliografía · UNAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/libros.css">
</head>
<body>

  <!-- ── HEADER ─────────────────────────────── -->
  <header class="header" id="lib-header">
    <div class="header-left">
      <div class="header-logo">Ж</div>
      <div class="header-divider"></div>
      <div class="header-text">
        <div class="header-title" id="header-title">Bibliografía</div>
        <div class="header-sub">Facultad de Ciencias · UNAM</div>
      </div>
    </div>
  </header>

  <!-- ── TABS BAR ──────────────────────────── -->
  <div class="lib-tabs-bar">
    <div class="lib-tabs" id="lib-tabs">
      <button class="lib-tab active" data-view="home">Libros</button>
      <button class="lib-tab" data-view="favs">Favoritos</button>
      <button class="lib-tab" data-view="search">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
        Buscar
      </button>
    </div>
  </div>

  <!-- ── SEARCH BAR ─────────────────────────── -->
  <div class="lib-search-bar" id="lib-search-bar" style="display:none">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
    <input type="text" id="lib-search-input" placeholder="Buscar libros, autores, teoremas…" autocomplete="off" spellcheck="false">
    <button id="lib-search-clear" class="search-clear-btn" style="display:none" aria-label="Limpiar">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- ── MAIN CONTENT ───────────────────────── -->
  <main class="lib-main" id="lib-main">
    <!-- populated by JS -->
  </main>

  <!-- ── BACK BUTTON ────────────────────────── -->
  <button class="lib-back-btn" id="lib-back-btn" style="display:none" aria-label="Volver">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    Volver
  </button>

  <!-- ── PDF READER OVERLAY ─────────────────── -->
  <div class="pdf-overlay" id="pdf-overlay" style="display:none" aria-modal="true">
    <div class="pdf-header">
      <button class="pdf-close-btn" id="pdf-close-btn" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="pdf-title" id="pdf-title"></span>
      <a class="pdf-newtab-btn" id="pdf-newtab-btn" target="_blank" rel="noopener" title="Abrir en nueva pestaña">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
    <div class="pdf-loading" id="pdf-loading">Cargando PDF…</div>
    <iframe class="pdf-frame" id="pdf-frame" src="" allow="autoplay" title="Lector PDF"></iframe>
  </div>

  <!-- ── BOTTOM NAV ─────────────────────────── -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </a>
    <a href="temarios.html" class="nav-item">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Temarios</span>
    </a>
    <a href="calificaciones.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Califs</span>
    </a>
    <a href="mapa.html" class="nav-item">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>Mapa</span>
    </a>
    <a href="libros.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Libros</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script src="assets/js/libros-data.js"></script>
  <script src="assets/js/libros.js"></script>
</body>
</html>
