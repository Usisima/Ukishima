<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Avance · UNAM</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/fonts/google-fonts.css">
  <link rel="stylesheet" href="assets/css/avance.css">
  <link rel="prefetch" href="index.html">
  <link rel="prefetch" href="temarios.html">
  <script type="speculationrules">
    {"prerender":[{"source":"list","urls":["index.html","temarios.html"]}]}
  </script>
</head>
<body>

  <!-- ── HEADER ─────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <button class="av-back-btn" id="av-back" aria-label="Volver" style="display:none">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="header-logo">Ж</div>
      <div class="header-divider"></div>
      <div class="header-text">
        <div class="header-title" id="av-header-title">Avance</div>
        <div class="header-sub">Facultad de Ciencias · UNAM</div>
      </div>
    </div>
    <!-- pill visible solo en home view -->
    <button class="av-add-pill" id="av-add-pill" onclick="A.openSubModal()" style="display:none">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none"
           stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5"  y1="12" x2="19" y2="12"/>
      </svg>
      Materia
    </button>
  </header>

  <!-- ── MAIN ───────────────────────────────── -->
  <main class="av-main" id="av-main"></main>

  <!-- ══════════════════════════════════════════
       MODAL: agregar materia (multi-campo)
       ══════════════════════════════════════════ -->
  <div class="av-modal" id="av-sub-modal" role="dialog" aria-modal="true">
    <div class="av-modal-sheet av-sub-sheet">
      <div class="av-modal-handle"></div>
      <div class="av-modal-title">Nueva materia</div>

      <form autocomplete="off" onsubmit="return false" role="presentation">

        <!-- Nombre -->
        <div class="av-name-wrap">
          <input class="av-modal-inp" id="av-sub-name" type="search"
                 placeholder="Nombre de la materia *" maxlength="80"
                 autocomplete="off" autocorrect="off"
                 autocapitalize="words" spellcheck="false"
                 data-lpignore="true" data-1p-ignore data-form-type="other">
          <div id="av-name-suggest" class="av-suggest"></div>
        </div>

        <!-- Profesor -->
        <input class="av-modal-inp" id="av-sub-prof" type="search"
               placeholder="Profesor" maxlength="80"
               autocomplete="off" autocorrect="off"
               autocapitalize="words" spellcheck="false"
               data-lpignore="true" data-1p-ignore data-form-type="other">

        <!-- Días -->
        <div class="av-field-label">Días</div>
        <div class="av-days-row" id="av-days-row">
          <button class="av-day-btn" data-day="Lun" type="button">L</button>
          <button class="av-day-btn" data-day="Mar" type="button">M</button>
          <button class="av-day-btn" data-day="Mié" type="button">X</button>
          <button class="av-day-btn" data-day="Jue" type="button">J</button>
          <button class="av-day-btn" data-day="Vie" type="button">V</button>
          <button class="av-day-btn" data-day="Sáb" type="button">S</button>
        </div>

        <!-- Hora + Semestre -->
        <div class="av-two-col">
          <div class="av-field">
            <div class="av-field-label">Hora</div>
            <input class="av-field-inp" id="av-sub-hora" type="time"
                   autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other">
          </div>
          <div class="av-field">
            <div class="av-field-label">Semestre</div>
            <select class="av-field-inp av-sel" id="av-sub-sem" autocomplete="off">
              <option value="">—</option>
              <option value="1">1°</option>
              <option value="2">2°</option>
              <option value="3">3°</option>
              <option value="4">4°</option>
              <option value="5">5°</option>
              <option value="6">6°</option>
              <option value="7">7°</option>
              <option value="8">8°</option>
              <option value="9">9°</option>
            </select>
          </div>
        </div>

        <div class="av-modal-row">
          <button class="av-modal-cancel" id="av-sub-cancel" type="button">Cancelar</button>
          <button class="av-modal-ok"     id="av-sub-ok"     type="button">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       MODAL: agregar tarea / examen
       ══════════════════════════════════════════ -->
  <div class="av-modal" id="av-modal" role="dialog" aria-modal="true">
    <div class="av-modal-sheet">
      <div class="av-modal-handle"></div>
      <div class="av-modal-title" id="av-modal-title">Nueva tarea</div>
      <form autocomplete="off" onsubmit="return false" role="presentation">
        <input type="text"     aria-hidden="true" tabindex="-1" style="display:none" autocomplete="username">
        <input type="password" aria-hidden="true" tabindex="-1" style="display:none" autocomplete="new-password">

        <input class="av-modal-inp" id="av-modal-inp" type="text"
               placeholder="Escribe aquí…" maxlength="80"
               autocomplete="one-time-code" autocorrect="off"
               autocapitalize="sentences" spellcheck="false"
               data-lpignore="true" data-1p-ignore data-form-type="other">
        <!-- fecha de entrega (solo para tareas) -->
        <div id="av-modal-date-row" class="av-modal-date-row" style="display:none">
          <div class="av-field-label">Fecha de entrega</div>
          <input class="av-field-inp av-modal-date-inp" id="av-modal-date" type="date"
                 autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other">
        </div>
        <div class="av-modal-row">
          <button class="av-modal-cancel" id="av-modal-cancel" type="button">Cancelar</button>
          <button class="av-modal-ok"     id="av-modal-ok"     type="button">Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── BOTTOM NAV ─────────────────────────── -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </a>
    <a href="temarios.html" class="nav-item">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Temarios</span>
    </a>
    <a href="avance.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      <span>Avance</span>
    </a>
    <a href="libros.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Libros</span>
    </a>
    <a href="calendario.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Horario</span>
    </a>
  </nav>

  <script src="assets/js/shared/page-transitions.js"></script>
  <script src="assets/js/shared/stars-bg.js"></script>
  <script src="assets/js/data/data.js"></script>
  <script src="assets/js/data/libros-data.js"></script>
  <script src="assets/js/avance/avance.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('[SW] Registro fallido:',e);});</script>
</body>
</html>
