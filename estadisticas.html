<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Estadísticas · UNAM</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgA.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nuFkD-vYSZviVYUb_rj3ij__anPXDTnogkk7.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu0-K4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/aFTU7PB1QTsUX8KYthqQBA.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/google-fonts.css">
  <link rel="stylesheet" href="assets/css/estadisticas.css">
  <style>
    /* texto seleccionable en Estadísticas (para copiar hex / nombre de ícono) */
    .stats-wrap, .stats-wrap * { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    /* ── ícono editable en la tarjeta de materia ── */
    .mat-card-iconwrap { position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
    .mat-card-icon-edit { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 7px; background: rgba(0,0,0,.55); color: #e8f5f2; opacity: 0; transition: opacity .15s; }
    .mat-card-iconwrap:hover .mat-card-icon-edit, .mat-card-iconwrap:focus-visible .mat-card-icon-edit { opacity: 1; }
    @media (hover: none) { .mat-card-icon-edit { opacity: .92; } }
    /* ── selector de íconos ── */
    html.ip-lock { overflow: hidden; touch-action: none; }
    .ip-overlay { position: fixed; inset: 0; z-index: 100002; background: rgba(0,0,0,.72); display: flex; align-items: flex-end; justify-content: center; overscroll-behavior: contain; }
    .ip-modal { width: 100%; max-width: 640px; max-height: 88vh; display: flex; flex-direction: column; background: #0b1310; border: 1px solid rgba(155,191,181,.18); border-radius: 18px 18px 0 0; overflow: hidden; }
    @media (min-width: 640px) { .ip-overlay { align-items: center; } .ip-modal { border-radius: 18px; } }
    .ip-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid rgba(155,191,181,.12); }
    .ip-title { font-size: 14px; color: rgba(232,245,242,.7); } .ip-title b { color: #e8f5f2; font-weight: 600; }
    .ip-close { background: none; border: 0; color: rgba(232,245,242,.6); font-size: 18px; cursor: pointer; padding: 4px 9px; border-radius: 8px; }
    .ip-close:hover { background: rgba(155,191,181,.1); color: #e8f5f2; }
    .ip-note { padding: 9px 16px; font-size: 11px; color: rgba(155,191,181,.5); border-bottom: 1px solid rgba(155,191,181,.08); }
    .ip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; padding: 14px 16px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .ip-cell { position: relative; aspect-ratio: 1/1; border: 2px solid transparent; border-radius: 11px; overflow: hidden; background: #0d1512; cursor: pointer; padding: 0; }
    .ip-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ip-cell.is-cur { border-color: rgba(155,191,181,.85); }
    .ip-cell.is-occ::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.4); pointer-events: none; }
    .ip-id { position: absolute; top: 3px; left: 4px; z-index: 2; font-size: 9px; font-family: 'DM Mono', monospace; color: rgba(255,255,255,.7); text-shadow: 0 1px 2px #000; }
    .ip-owner { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 3px 4px; font-size: 8.5px; line-height: 1.15; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.85)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ic-out { box-sizing: border-box; width: calc(100% - 32px); height: 46vh; margin: 0 16px 16px; padding: 10px; resize: none; border: 1px solid rgba(155,191,181,.2); border-radius: 10px; background: #07100d; color: #cfe8e2; font-family: 'DM Mono', monospace; font-size: 11px; line-height: 1.45; user-select: text; -webkit-user-select: text; }
  </style>
  <link rel="preload" as="script" href="assets/js/data/data.js">
  <script src="assets/js/shared/page-transitions.js"></script>
  <script src="assets/js/shared/carrera.js"></script>

<div class="stats-wrap">

  <!-- ── CARRERA ACTIVA ──────────────────────── -->
  <section class="backup-card">
    <div class="backup-head">
      <span class="backup-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </span>
      <div class="backup-text">
        <div class="backup-title">Carrera</div>
        <div class="backup-sub" id="carrera-current">—</div>
      </div>
    </div>
    <div class="backup-actions">
      <button class="backup-btn" id="btn-carrera">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        Cambiar carrera
      </button>
      <button class="backup-btn" id="btn-icon-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2a10 10 0 1 0 0 20 1.5 1.5 0 0 0 1-2.6 1.5 1.5 0 0 1 1-2.6h2A4.5 4.5 0 0 0 22 12 10 10 0 0 0 12 2z"/></svg>

      </button>

  <!-- ── RESPALDO DE DATOS ───────────────────── -->
  <section class="backup-card">
    <div class="backup-head">
      <span class="backup-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </span>
      <div class="backup-text">
        <div class="backup-title">Respaldo de datos</div>
        <div class="backup-sub">Tu avance, calificaciones, favoritos y notas propias se guardan solo en este dispositivo. Expórtalos para no perderlos al cambiar de equipo o borrar el navegador.</div>
      </div>
    </div>
    <div class="backup-actions">
      <button class="backup-btn backup-btn--primary" id="btn-export">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar
      </button>
      <button class="backup-btn" id="btn-import">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Importar
      </button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>

    <div class="backup-msg" id="backup-msg" role="status" aria-live="polite"></div>
  </section>

  <div class="summary-row" id="summary-row"></div>
  <div class="summary-progress-wrap" id="summary-progress"></div>
  <div id="sections-container"></div>
</div>

<script src="assets/js/data/data-fisica.js"></script>
<script src="assets/js/data/data-actuaria.js"></script>
<script src="assets/js/data/data.js"></script>
<script>
(function () {

  /* ── back button ── */
  document.getElementById('btn-back').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.replace('index.html');
  });

  /* ── carrera activa + cambiar ── */
  (function () {
    if (!window.UK || !UK.carreraInfo) return;
    var info = UK.carreraInfo();
    var cur = document.getElementById('carrera-current');
    if (cur) cur.textContent = info.name + ' · ' + info.sub;
    var btn = document.getElementById('btn-carrera');
    if (btn) btn.addEventListener('click', function () {
      UK.showCarreraSelect(function () { location.href = 'index.html'; });
    });
  })();

  /* ── helpers ── */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // Tiene temario: en el objeto (materia / optativa enriquecida) o en OPT_DATA.
  function hasTemario(item) {
    if (Array.isArray(item.temario) && item.temario.length > 0) return true;
    var d = (typeof OPT_DATA !== 'undefined' && OPT_DATA) ? OPT_DATA[item.name] : null;
    return !!(d && Array.isArray(d.temario) && d.temario.length > 0);
  }

  function card(val, cls, lbl) {
    return '<div class="summary-card">' +
      '<span class="summary-val' + (cls ? ' ' + cls : '') + '">' + val + '</span>' +
      '<span class="summary-lbl">' + lbl + '</span>' +
    '</div>';
  }

  function matCard(name, icon, ok) {
    var cls    = ok ? 'has-temario' : 'no-temario';
    var dotCls = ok ? 'ok' : 'miss';
    var badge  = ok
      ? '<span class="mat-card-badge ok">✓ Temario</span>'
      : '<span class="mat-card-badge miss">✗ Falta</span>';
    return '<div class="mat-card ' + cls + '" data-name="' + esc(name) + '">' +
      '<div class="mat-card-color-bar"></div>' +
      '<button class="mat-card-iconwrap" type="button" data-edit-icon title="Cambiar ícono">' +
        '<img class="mat-card-icon" src="' + esc(icon) + '" alt="" loading="lazy">' +
        '<span class="mat-card-icon-edit" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>' +
        '</span>' +
      '</button>' +
      '<span class="mat-card-dot ' + dotCls + '"></span>' +
      '<div class="mat-card-body">' +
        '<span class="mat-card-name">' + name + '</span>' +
        '<div class="mat-card-footer">' +
          badge +
          '<span class="mat-card-color-chip">' +
            '<span class="mat-card-color-dot"></span>' +
            '<span class="mat-card-color-hex">—</span>' +
          '</span>' +
          '<span class="mat-card-icon-name">' + esc(icon.split('/').pop()) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ── color extraction ── */
  var offCanvas = document.createElement('canvas');
  offCanvas.width = offCanvas.height = 20;
  var offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

  function toHex(v) { return ('0' + Math.round(v).toString(16)).slice(-2); }

  /* Matiz dominante por histograma (bins 5°, S/L reales del píxel) */
  function hslToHex(h, s, l) {
    s/=100; l/=100;
    var a = s * Math.min(l, 1-l);
    var f = function(n){
      var k=(n+h/30)%12;
      var c=l - a*Math.max(-1, Math.min(k-3, Math.min(9-k, 1)));
      return toHex(c*255);
    };
    return '#'+f(0)+f(8)+f(4);
  }
  function extractVibrant(img) {
    try {
      offCtx.clearRect(0, 0, 20, 20);
      offCtx.drawImage(img, 0, 0, 20, 20);
      var px = offCtx.getImageData(0, 0, 20, 20).data;
      var STEP = 5, BINS = 72;
      function tally(minS) {
        var binW = new Float32Array(BINS), binSw = new Float32Array(BINS), binLw = new Float32Array(BINS);
        for (var i = 0; i < px.length; i += 4) {
          var rn = px[i]/255, gn = px[i+1]/255, bn = px[i+2]/255;
          var mx = Math.max(rn,gn,bn), mn = Math.min(rn,gn,bn), d = mx - mn;
          var l  = (mx + mn) / 2;
          if (l < 0.20 || l > 0.90) continue;
          var s  = d === 0 ? 0 : d / (1 - Math.abs(2*l - 1));
          if (s < minS) continue;
          var h;
          if (mx===rn) h=((gn-bn)/d%6)*60; else if (mx===gn) h=((bn-rn)/d+2)*60; else h=((rn-gn)/d+4)*60;
          if (h<0) h+=360;
          var b = Math.round(h/STEP) % BINS, w = s;
          binW[b] += w; binSw[b] += s*w; binLw[b] += l*w;
        }
        var best=0, bw=binW[0];
        for (var b2=1;b2<BINS;b2++) if (binW[b2]>bw){bw=binW[b2];best=b2;}
        if (bw <= 0) return null;
        return { h: best*STEP, s: binSw[best]/bw*100, l: binLw[best]/bw*100 };
      }
      var r = tally(0.06);
      return r ? hslToHex(r.h, r.s, r.l)
               : hslToHex(165, 8, 40); /* totalmente neutro */
    } catch(e) { return null; }
  }

  function colorizeCards() {
    document.querySelectorAll('.mat-card').forEach(function(card) {
      var img  = card.querySelector('.mat-card-icon');
      var bar  = card.querySelector('.mat-card-color-bar');
      var dot  = card.querySelector('.mat-card-color-dot');
      var chip = card.querySelector('.mat-card-color-chip');
      if (!img || !bar || !dot || !chip) return;
      function apply() {
        var hex = extractVibrant(img);
        if (!hex) return;
        bar.style.background = hex;
        dot.style.background = hex;
        chip.querySelector('.mat-card-color-hex').textContent = hex;
        chip.classList.add('loaded');
        try {
          var src = img.getAttribute('src');
          var vc  = JSON.parse(localStorage.getItem('ukishima_vibrant26') || '{}');
          vc[src] = hex;
          localStorage.setItem('ukishima_vibrant26', JSON.stringify(vc));
        } catch(e) {}
      }
      if (img.complete && img.naturalWidth > 0) { apply(); }
      else { img.addEventListener('load', apply, { once: true }); }
    });
  }

  /* ── colección de materias de la carrera activa ── */
  var troncoMats   = CURRICULUM.flatMap(function (sem) { return sem.materias || []; });
  var optBloques   = (typeof OPT_BLOQUES !== 'undefined' ? OPT_BLOQUES : []);
  var allOptativas = optBloques.reduce(function (a, b) { return a.concat(b.pool || []); }, []);
  var allSubjects  = troncoMats.concat(allOptativas);   // para el selector de íconos

  var container = document.getElementById('sections-container');

  function renderSections() {
    var totalMats = troncoMats.length + allOptativas.length;
    var conTem = troncoMats.filter(hasTemario).length + allOptativas.filter(hasTemario).length;
    var sinTem = totalMats - conTem;
    var pct    = totalMats ? Math.round(conTem / totalMats * 100) : 0;

    document.getElementById('summary-row').innerHTML =
      card(totalMats, '', 'Materias') +
      card(conTem, 'ok', 'Con temario') +
      card(sinTem, 'miss', 'Sin temario');

    document.getElementById('summary-progress').innerHTML =
      '<div class="summary-progress-label">' +
        '<span>Cobertura de temarios</span>' +
        '<span>' + conTem + ' / ' + totalMats + ' · ' + pct + '%</span>' +
      '</div>' +
      '<div class="summary-progress-bar-bg">' +
        '<div class="summary-progress-bar-fill" style="width:' + pct + '%"></div>' +
      '</div>';

    var html = '';

    /* Obligatorias por semestre */
    var tcConTem = troncoMats.filter(hasTemario).length;
    html += '<div class="section-heading">' +
      '<h2>Materias obligatorias</h2>' +
      '<span class="section-count">' + tcConTem + ' / ' + troncoMats.length + ' con temario</span>' +
    '</div>';
    CURRICULUM.forEach(function (sem) {
      if (!sem.materias || sem.materias.length === 0) return;
      html += '<div class="subsection-heading">' + esc(sem.titulo) + '</div><div class="cards-grid">';
      sem.materias.forEach(function (mat) { html += matCard(mat.name, mat.icon, hasTemario(mat)); });
      html += '</div>';
    });

    /* Optativas por sección de la carrera (bloque / área / campo) */
    if (allOptativas.length) {
      var optConTem = allOptativas.filter(hasTemario).length;
      html += '<div class="section-heading">' +
        '<h2>Optativas</h2>' +
        '<span class="section-count">' + optConTem + ' / ' + allOptativas.length + ' con temario</span>' +
      '</div>';
      optBloques.forEach(function (b) {
        if (!b.pool || !b.pool.length) return;
        html += '<div class="subsection-heading">' + esc(b.label) + '</div><div class="cards-grid">';
        b.pool.forEach(function (opt) { html += matCard(opt.name, opt.icon, hasTemario(opt)); });
        html += '</div>';
      });
    }

    container.innerHTML = html;
    colorizeCards();
  }

  renderSections();

  /* ════════ SELECTOR DE ÍCONOS ════════ */
  var ICON_COUNT = (window.UK && UK.ICON_COUNT) || 132;
  var BAD_ICON = (window.UK && UK.BAD_ICONS) || {};

  function occupiedMap() {
    var m = {};
    allSubjects.forEach(function (s) {
      var f = (s.icon || '').split('/').pop();
      if (f) (m[f] = m[f] || []).push(s.name);
    });
    return m;
  }

  var picker = null, pickerPushed = false;
  function onPickKey(e) { if (e.key === 'Escape') closePicker(); }
  function onPickerPop() { pickerPushed = false; closePicker(true); }   // regresar → cierra el menú
  function closePicker(fromPop) {
    if (!picker) return;
    picker.remove(); picker = null;
    document.documentElement.classList.remove('ip-lock');
    document.removeEventListener('keydown', onPickKey);
    window.removeEventListener('popstate', onPickerPop);
    // si NO viene de "regresar", consumimos la entrada de historial que empujamos
    if (!fromPop && pickerPushed) { try { history.back(); } catch (e) {} }
    pickerPushed = false;
  }

  function openPicker(matName) {
    var subj = allSubjects.filter(function (s) { return s.name === matName; })[0];
    if (!subj) return;
    var occ = occupiedMap();
    var curFile = (subj.icon || '').split('/').pop();
    var cells = '';
    for (var i = 0; i < ICON_COUNT; i++) {
      var file = 'd' + i + '.webp';
      if (BAD_ICON[file]) continue;                 // imagen excluida (rota)
      var owners = (occ[file] || []).filter(function (n) { return n !== matName; });
      var curCls = file === curFile ? ' is-cur' : '';
      var occCls = owners.length ? ' is-occ' : '';
      var owner  = owners.length
        ? '<span class="ip-owner">' + esc(owners[0]) + (owners.length > 1 ? ' +' + (owners.length - 1) : '') + '</span>'
        : '';
      cells += '<button class="ip-cell' + curCls + occCls + '" type="button" data-file="' + file + '">' +
        '<img src="assets/images/' + file + '" loading="lazy" alt="">' +
        '<span class="ip-id">' + i + '</span>' + owner +
      '</button>';
    }
    var ov = document.createElement('div');
    ov.className = 'ip-overlay';
    ov.innerHTML =
      '<div class="ip-modal" role="dialog" aria-modal="true" aria-label="Elegir ícono">' +
        '<div class="ip-head">' +
          '<div class="ip-title">Ícono · <b>' + esc(matName) + '</b></div>' +
          '<button class="ip-close" type="button" aria-label="Cerrar">✕</button>' +
        '</div>' +
        '<div class="ip-note">Toca una imagen para asignarla. Las oscurecidas ya las usa otra materia (se indica cuál).</div>' +
        '<div class="ip-grid">' + cells + '</div>' +
      '</div>';
    document.body.appendChild(ov);
    picker = ov;
    document.documentElement.classList.add('ip-lock');   // bloquea scroll de fondo
    // entrada de historial para que el gesto de regresar cierre el menú
    try { history.pushState({ ipPicker: 1 }, ''); pickerPushed = true; } catch (e) { pickerPushed = false; }
    window.addEventListener('popstate', onPickerPop);
    document.addEventListener('keydown', onPickKey);
    var curEl = ov.querySelector('.ip-cell.is-cur');
    if (curEl && curEl.scrollIntoView) curEl.scrollIntoView({ block: 'center' });
    ov.addEventListener('click', function (e) {
      if (e.target === ov || e.target.closest('.ip-close')) { closePicker(); return; }
      var cell = e.target.closest('.ip-cell');
      if (cell) pickIcon(matName, 'assets/images/' + cell.getAttribute('data-file'));
    });
  }

  function pickIcon(matName, iconPath) {
    if (window.UK && UK.setIconOverride) UK.setIconOverride(matName, iconPath);
    allSubjects.forEach(function (s) { if (s.name === matName) s.icon = iconPath; });
    closePicker();
    renderSections();
  }

  /* Delegación: click en el ícono de una tarjeta → abre el selector */
  container.addEventListener('click', function (e) {
    if (!e.target.closest('[data-edit-icon]')) return;
    var c = e.target.closest('.mat-card');
    if (c) openPicker(c.getAttribute('data-name'));
  });

  /* ════════ EXPORTAR COLORES DE ÍCONOS ════════
     Calcula el color dominante (extractVibrant) de cada imagen dN y entrega un
     JSON { "d0": {hex,h,s,l}, ... } para reordenar/renombrar por hue.        */
  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255,
        g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2, h = 0, s = 0;
    if (d) {
      s = d / (1 - Math.abs(2 * l - 1));
      if (mx === r) h = (g - b) / d % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  function exportIconColors() {
    var nums = [];
    for (var i = 0; i < ICON_COUNT; i++) if (!BAD_ICON['d' + i + '.webp']) nums.push(i);

    var ov = document.createElement('div');
    ov.className = 'ip-overlay';
    ov.innerHTML =
      '<div class="ip-modal" role="dialog" aria-modal="true" aria-label="Colores de íconos">' +
        '<div class="ip-head"><div class="ip-title">Colores de íconos</div>' +
          '<button class="ip-close" type="button" aria-label="Cerrar">✕</button></div>' +
        '<div class="ip-note" id="ic-status">Calculando… 0 / ' + nums.length + '</div>' +
        '<textarea class="ic-out" readonly spellcheck="false"></textarea>' +
      '</div>';
    document.body.appendChild(ov);
    document.documentElement.classList.add('ip-lock');
    var ta = ov.querySelector('.ic-out'), status = ov.querySelector('#ic-status');
    function close() { ov.remove(); document.documentElement.classList.remove('ip-lock'); }
    ov.addEventListener('click', function (e) { if (e.target === ov || e.target.closest('.ip-close')) close(); });

    var out = {}, done = 0;
    function finish() {
      done++;
      if (done < nums.length) { status.textContent = 'Calculando… ' + done + ' / ' + nums.length; return; }
      status.textContent = 'Listo · ' + nums.length + ' íconos. Selecciona todo (ya está seleccionado) y cópialo.';
      ta.value = JSON.stringify(out);
      ta.focus(); ta.select();
    }
    nums.forEach(function (num) {
      var img = new Image();
      img.onload = function () {
        var hex = extractVibrant(img) || '#000000';
        var hsl = hexToHsl(hex);
        out['d' + num] = { hex: hex, h: hsl.h, s: hsl.s, l: hsl.l };
        finish();
      };
      img.onerror = function () { out['d' + num] = null; finish(); };
      img.src = 'assets/images/d' + num + '.webp';
    });
  }
  var btnIC = document.getElementById('btn-icon-colors');
  if (btnIC) btnIC.addEventListener('click', exportIconColors);

})();
</script>

<!-- ── RESPALDO: exportar / importar localStorage ── -->
<script>
(function () {
  function collectData() {
    var data = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      data[k] = localStorage.getItem(k);
    }
    return data;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function stamp() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function showMsg(text, kind) {
    var el = document.getElementById('backup-msg');
    if (!el) return;
    el.textContent = text;
    el.className = 'backup-msg' + (kind ? ' is-' + kind : '');
  }

  function doExport() {
    try {
      var payload = {
        app: 'ukishima',
        type: 'backup',
        version: 1,
        exportedAt: new Date().toISOString(),
        data: collectData(),
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'ukishima-respaldo-' + stamp() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showMsg('Respaldo exportado (' + Object.keys(payload.data).length + ' registros).', 'ok');
    } catch (e) {
      showMsg('No se pudo exportar: ' + e.message, 'err');
    }
  }

  function doImport(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var data = parsed && parsed.data ? parsed.data : parsed;
        if (!data || typeof data !== 'object') throw new Error('formato no válido');
        var keys = Object.keys(data);
        if (!keys.length) throw new Error('el archivo no contiene datos');
        if (!confirm('Esto sobrescribirá tus datos actuales (avance, calificaciones, favoritos y notas) con los del respaldo (' + keys.length + ' registros). ¿Continuar?')) {
          showMsg('Importación cancelada.', '');
          return;
        }
        keys.forEach(function (k) {
          var v = data[k];
          localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
        });
        showMsg('Respaldo importado. Recargando…', 'ok');
        setTimeout(function () { location.reload(); }, 800);
      } catch (e) {
        showMsg('Archivo inválido: ' + e.message, 'err');
      }
    };
    reader.onerror = function () { showMsg('No se pudo leer el archivo.', 'err'); };
    reader.readAsText(file);
  }

  var btnE  = document.getElementById('btn-export');
  var btnI  = document.getElementById('btn-import');
  var fileI = document.getElementById('import-file');
  if (btnE) btnE.addEventListener('click', doExport);
  if (btnI && fileI) {
    btnI.addEventListener('click', function () { fileI.value = ''; fileI.click(); });
    fileI.addEventListener('change', function () {
      if (fileI.files && fileI.files[0]) doImport(fileI.files[0]);
    });
  }
})();
</script>
